
name: Split AVWAP CSV for ChatGPT

on:
  push:
    paths:
      - 'data/avwap_market_latest.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avwap-split
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build small CSV chunks
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          source = Path("data/avwap_market_latest.csv")
          with source.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              columns = reader.fieldnames
              rows = list(reader)

          target = Path("data/chunks")
          target.mkdir(parents=True, exist_ok=True)

          groups = {}
          for row in rows:
              code = row.get("code", "")
              key = (code[:2] or "other").upper()
              groups.setdefault(key, []).append(row)

          for old in target.glob("*.csv"):
              old.unlink()

          for key, records in sorted(groups.items()):
              with (target / f"{key}.csv").open(
                  "w", encoding="utf-8", newline=""
              ) as f:
                  writer = csv.DictWriter(f, fieldnames=columns)
                  writer.writeheader()
                  writer.writerows(records)

          index = {
              "source": str(source),
              "total_rows": len(rows),
              "asof_jst": max(
                  (r.get("asof_jst", "") for r in rows),
                  default=""
              ),
              "price_date": max(
                  (r.get("price_date", "") for r in rows),
                  default=""
              ),
              "chunks": {
                  key: {
                      "path": f"data/chunks/{key}.csv",
                      "count": len(records)
                  }
                  for key, records in sorted(groups.items())
              }
          }

          Path("data/avwap_index.json").write_text(
              json.dumps(index, ensure_ascii=False, indent=2)
              + "\n",
              encoding="utf-8"
          )

      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/chunks data/avwap_index.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate small AVWAP CSV chunks"
            git push
          fi
